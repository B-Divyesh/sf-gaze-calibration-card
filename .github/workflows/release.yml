name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Rebuild checksums and latest.json from an existing release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.metadata_only != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux system packages
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Gaze Calibration Card v__VERSION__
          releaseBody: |
            A private nine-point reliability check for gaze-controlled pointers.

            These builds are unsigned. On macOS, right-click the app and choose Open. On Windows, confirm the publisher warning.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}

  manifest:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.metadata_only == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.version.outputs.tag }}" --dir release-assets
      - name: Write checksums and latest manifest
        run: |
          rm -f release-assets/SHA256SUMS release-assets/latest.json
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          node tools/make-release-manifest.mjs release-assets "${{ steps.version.outputs.value }}" "$GITHUB_REPOSITORY"
      - name: Publish manifest and checksums
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release-assets/*
          token: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
