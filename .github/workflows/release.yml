name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Rebuild checksums and latest.json from an existing release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.metadata_only != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install pinned Linux packaging prerequisites
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y file libfuse2t64 libglib2.0-dev libgtk-3-dev libgtk-3-bin libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
          # The pinned linuxdeploy GTK plugin looks in libgtk-3-0. Ubuntu 24.04
          # renamed that package directory to libgtk-3-0t64, returning 127.
          sudo install -d /usr/lib/x86_64-linux-gnu/libgtk-3-0
          sudo ln -sfn ../libgtk-3-0t64/gtk-query-immodules-3.0 /usr/lib/x86_64-linux-gnu/libgtk-3-0/gtk-query-immodules-3.0
          test -x /usr/lib/x86_64-linux-gnu/libgtk-3-0/gtk-query-immodules-3.0
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Run pinned linuxdeploy helpers by extraction, not the runner's FUSE
          # device. This is required on hosted and container release workers.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: v__VERSION__
          releaseName: Gaze Calibration Card v__VERSION__
          releaseBody: |
            A private nine-point comparison for gaze-controlled pointers.

            These builds are unsigned. On macOS, right-click the app and choose Open. On Windows, confirm the publisher warning.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}
      - name: Verify unsigned desktop packages
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target -Recurse -Filter "*.exe" | Where-Object { $_.Name -match "setup|Gaze" } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne "NotSigned") { throw "Expected an unsigned Windows package; got $($signature.Status)." }
          Write-Host "Verified unsigned Windows package: $($installer.Name)"
      - name: Verify unsigned desktop packages
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target -type d -name '*.app' -print -quit)"
          test -n "$APP"
          signing="$(codesign -dv --verbose=4 "$APP" 2>&1 || true)"
          if grep -q 'Authority=Developer ID' <<<"$signing"; then
            echo "Expected an unsigned macOS package." >&2
            exit 1
          fi
          grep -Eqi 'not signed|code object is not signed|Signature=adhoc' <<<"$signing"
          echo "Verified unsigned macOS package: $APP"

  manifest:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.metadata_only == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.version.outputs.tag }}" --dir release-assets
      - name: Write checksums and latest manifest
        run: |
          rm -f release-assets/SHA256SUMS release-assets/latest.json
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          node tools/make-release-manifest.mjs release-assets "${{ steps.version.outputs.value }}" "$GITHUB_REPOSITORY"
      - name: Publish manifest and checksums
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release-assets/*
          token: ${{ secrets.FACTORY_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
