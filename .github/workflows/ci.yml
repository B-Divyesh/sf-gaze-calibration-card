name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - run: npm run test:unsigned-builds

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject a corrupt download before opening it
        shell: pwsh
        run: ./tests/installer-checksum.ps1
